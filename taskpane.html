<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucidchart Diagrams</title>
<link rel="icon" href="icon-32.png">
<script>
  // Registered before office.js loads, so it runs before office.js's own message
  // listener: Lucid's embed posts to this window, and office.js talks to Word
  // over the same window messages. Keeping Lucid's messages away from it is a
  // guess at why Word calls hung in Word on the web ("r is not a function").
  window.addEventListener("message", e => {
    if (e.origin !== "https://lucid.app") return;
    e.stopImmediatePropagation();
    onLucidMessage(e.data);
  });
</script>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: "Segoe UI", Calibri, system-ui, sans-serif; font-size: 14px; margin: 0;
    height: 100vh; display: flex; flex-direction: column; background: #fff; color: #000; }
  button { font: inherit; padding: 0.35rem 0.7rem; border: 1px solid #bbb; border-radius: 4px;
    background: #f5f5f5; cursor: pointer; }
  button:hover:not(:disabled) { background: #e9eefb; }
  button:disabled { color: #aaa; cursor: default; }
  button.primary { background: #2563eb; border-color: #1d4ed8; color: #fff; }
  button.primary:disabled { background: #9db5ef; border-color: #9db5ef; color: #fff; }

  #top { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.4rem 0.6rem;
    border-bottom: 1px solid #e0e0e0; flex: none; }
  #status { flex: 1; min-width: 0; color: #444; font-size: 0.85rem; }
  #status.err { color: #b42318; }
  #build { color: #999; font-size: 0.75rem; flex: none; }

  #main { flex: 1; min-height: 0; position: relative; }
  #frame { width: 100%; height: 100%; border: 0; display: block; }
  #card { position: absolute; inset: 0; padding: 2rem 1.2rem; text-align: center; background: #fff; }
  #card p { color: #444; line-height: 1.45; max-width: 26rem; margin: 0 auto 1rem; }

  #actions { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.5rem 0.6rem;
    border-top: 1px solid #e0e0e0; flex: none; }
  #target { flex-basis: 100%; font-size: 0.8rem; color: #555; }
  #fallback { flex-basis: 100%; font-size: 0.8rem; color: #666; }
  #fallback input { width: 100%; margin-top: 0.3rem; font: inherit; padding: 0.25rem; }
</style>
</head>
<body>
<div id="top">
  <span id="status">Starting...</span>
  <span id="build">build v11</span>
</div>
<div id="main">
  <iframe id="frame" allow="clipboard-read; clipboard-write; fullscreen" hidden></iframe>
  <div id="card">
    <p id="cardText"></p>
    <button id="signIn" class="primary" hidden>Sign in to Lucid</button>
    <button id="retry" hidden>Retry</button>
  </div>
</div>
<div id="actions">
  <div id="target"></div>
  <button id="insert" class="primary" title="Insert the diagram open in the editor below the cursor">Insert new</button>
  <button id="replace" title="Replace the selected diagram picture with the diagram open in the editor">Replace selected</button>
  <button id="load" title="Open the selected diagram picture in the editor">Load selected</button>
  <button id="new" title="Back to Lucid's document picker">New / other diagram</button>
  <button id="lucid" title="Open the editor's diagram on lucid.app in a browser tab, for more room">Open in Lucid &#8599;</button>
  <details id="fallback">
    <summary>Diagram not detected?</summary>
    Paste its Lucid URL (lucid.app/lucidchart/&hellip;/edit):
    <input id="docUrl" placeholder="https://lucid.app/lucidchart/...">
  </details>
</div>
<script>
// Hardcoded: the prototype backend runs on this machine only (see server.js).
const BACKEND = "https://localhost:3000";
const UUID = "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";
const MAX_WIDTH_PT = 468; // 6.5in: the text width of a Letter page with 1in margins
const $ = id => document.getElementById(id);

let inWord = false;
let current = null;  // { documentId, embedId } of the diagram open in the editor
// What's selected in Word: { kind: "ours" | "other" | "none", title }.
let selected = { kind: "none" };
// The picture last inserted or loaded, { tag, title }: Replace's target when
// nothing is selected, so load-edit-replace needs no trip back to the document.
let last = null;
let busy = false;
let signInTimer = null;

function say(msg, isError) {
  $("status").textContent = msg;
  $("status").className = isError ? "err" : "";
  (isError ? console.error : console.log)("status:", msg);
}

function refreshButtons() {
  const ready = inWord && !busy;
  $("insert").disabled = !ready || !current;
  $("replace").disabled = !ready || !current || !(selected.kind === "ours" || (selected.kind === "none" && last));
  $("load").disabled = !ready || selected.kind !== "ours";
  $("new").disabled = busy;
  $("lucid").disabled = !current;
  $("target").textContent = !inWord ? ""
    : selected.kind === "ours" ? `Selected in document: "${selected.title}"`
    : selected.kind === "other" ? "The selected picture isn't a Lucid diagram from this add-in."
    : last ? `Nothing selected. Replace targets "${last.title}", the diagram you last inserted or loaded.`
    : "Select a diagram in the document to load or replace it.";
}

function showCard(text, { signIn = false, retry = false } = {}) {
  $("cardText").textContent = text;
  $("signIn").hidden = !signIn;
  $("retry").hidden = !retry;
  $("card").hidden = false;
  $("frame").hidden = true;
}

function within(promise, ms, what) {
  return Promise.race([promise, new Promise((_, reject) =>
    setTimeout(() => reject(new Error(what + " didn't respond. Try again; if it keeps happening, reload the add-in.")), ms))]);
}

const word = fn => within(Word.run(fn), 20000, "Word");

// Every backend call goes through here, so failures come back as something to act on.
async function backend(path) {
  let r;
  try { r = await fetch(BACKEND + path); }
  catch (e) {
    showCard("Can't reach the add-in's backend at " + BACKEND + ". Start it with `node server.js` in the project folder. "
      + "If it is running, your browser may be blocking this page from reaching localhost: allow local network access "
      + "for tigerbitten.github.io in the browser's site settings.", { retry: true });
    throw new Error("Backend unreachable.");
  }
  if (r.ok) return r.json();
  const msg = await r.text();
  if (r.status === 401) showCard(msg, { signIn: true });
  throw new Error(msg);
}

// Runs one button's work: one thing at a time, and errors land in the status line.
async function act(label, fn) {
  busy = true; refreshButtons(); say(label);
  try { await fn(); }
  catch (e) {
    // Office.js errors often carry the useful part in .code/.debugInfo, not .message.
    console.error(e, e && e.debugInfo);
    say(e instanceof Error && !e.code ? e.message
      : "Word error: " + [e && e.code, e && e.message, e && e.debugInfo && JSON.stringify(e.debugInfo)].filter(Boolean).join(" | "), true);
  }
  finally { busy = false; refreshButtons(); readSelection(); }
}

async function loadEditor(embedId) {
  const { token } = await backend("/embed-token" + (embedId ? "?embedId=" + embedId : ""));
  $("frame").src = "https://lucid.app/embeds?token=" + encodeURIComponent(token);
  $("card").hidden = true;
  $("frame").hidden = false;
}

async function start() {
  say("Connecting...");
  try {
    if ((await backend("/status")).signedIn) {
      // After a re-sign-in, come back to the diagram that was open.
      const embedId = current && current.embedId;
      await loadEditor(embedId);
      say(embedId ? "Signed in. Carry on editing." : "Pick or create a document, choose Edit, then click Insert in the editor.");
    } else {
      showCard("Sign in to your Lucid account to draw diagrams here.", { signIn: true });
      say("Not signed in.");
    }
  } catch (e) { say(e.message, true); }
}

// The embed announces which document was picked; that's the diagram Insert/Replace use.
function onLucidMessage(data) {
  if (typeof data === "string") { try { data = JSON.parse(data); } catch { return; } }
  console.log("lucid message", data);
  if (data && data.type === "LucidEmbedEvent" && data.event === "EmbedCreated") {
    current = { documentId: data.documentId, embedId: data.embedId };
    say(inWord ? "Ready. Edit the diagram, then Insert new or Replace selected." : "Diagram ready (open in Word to insert).");
    refreshButtons();
  }
}

// Alt text links the picture back to its Lucid diagram so it can be reopened and
// replaced. Stage 2 adds the Mermaid translation below these lines.
function altText(title, ids) {
  return `Lucidchart diagram: ${title}\nhttps://lucid.app/lucidchart/${ids.documentId}/edit`
    + (ids.embedId ? `\nlucid-embed: ${ids.embedId}` : "");
}

function parseAlt(alt) {
  const doc = (alt || "").match(new RegExp("lucid\\.app/lucidchart/(" + UUID + ")"));
  const embed = (alt || "").match(new RegExp("lucid-embed: (" + UUID + ")"));
  const title = (alt || "").match(/^Lucidchart diagram: (.*)$/m);
  return doc && { documentId: doc[1], embedId: embed ? embed[1] : null, title: title ? title[1] : "untitled" };
}

// Each picture carries a short random tag in its alt-text title, so "the picture
// last inserted or loaded" can be found again in a later Word.run.
const TAG_PREFIX = "Lucidchart diagram #";
const newTag = () => TAG_PREFIX + Math.random().toString(36).slice(2, 8);

function dress(pic, d, ids, tag) {
  const widthPt = d.width * 72 / d.dpi, heightPt = d.height * 72 / d.dpi;
  const scale = Math.min(1, MAX_WIDTH_PT / widthPt);
  pic.width = widthPt * scale;
  pic.height = heightPt * scale;
  pic.altTextTitle = tag;
  pic.altTextDescription = altText(d.title, ids);
}

// What the selection holds: no picture, someone else's picture, or one of our
// diagrams (with the Word objects needed to replace it).
async function inspectSelection(ctx) {
  const range = ctx.document.getSelection();
  const pics = range.inlinePictures;
  pics.load("items/altTextDescription,items/altTextTitle");
  range.load("text");
  await ctx.sync();
  if (!pics.items.length) return { kind: "none" };
  const pic = pics.items.find(p => parseAlt(p.altTextDescription));
  if (!pic) return { kind: "other" };
  const found = parseAlt(pic.altTextDescription);
  // Replacing through the range is what the sibling add-in found swaps a picture
  // cleanly in place, but it replaces everything selected, so only when the picture is all there is.
  return { kind: "ours", title: found.title, found, pic, range, alone: pics.items.length === 1 && range.text.trim().length <= 1 };
}

async function readSelection() {
  if (!inWord) return;
  try { await word(async ctx => { const s = await inspectSelection(ctx); selected = { kind: s.kind, title: s.title }; }); }
  catch (e) { console.warn("reading selection:", e); selected = { kind: "none" }; }
  refreshButtons();
}

let selectionTimer = null;
function onSelectionChanged() {
  clearTimeout(selectionTimer);
  selectionTimer = setTimeout(readSelection, 250); // selection events arrive in bursts while typing
}

// Callers capture `current` up front: the embed can announce another diagram
// while the export is in flight.
async function exportDiagram(ids) {
  say("Exporting from Lucid...");
  const d = await backend("/export?doc=" + ids.documentId);
  console.log("export", d.title, d.width + "x" + d.height, d.base64.length, "base64 chars");
  d.base64 = await plainPng(d.base64);
  say("Placing in document...");
  return d;
}

// Word on the web refused Lucid's PNG ("unable to insert the picture"): it's a
// palette PNG with colour-profile and text chunks. Redrawn through a canvas it
// becomes a plain RGBA PNG, the kind the sibling add-ins insert without trouble.
async function plainPng(base64) {
  const img = new Image();
  img.src = "data:image/png;base64," + base64;
  await img.decode();
  const canvas = document.createElement("canvas");
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  canvas.getContext("2d").drawImage(img, 0, 0);
  return canvas.toDataURL("image/png").split(",")[1];
}

$("insert").onclick = () => act("Inserting...", async () => {
  const ids = current;
  const d = await exportDiagram(ids);
  const tag = newTag();
  await word(async ctx => {
    const para = ctx.document.getSelection().paragraphs.getLast().insertParagraph("", Word.InsertLocation.after);
    para.alignment = Word.Alignment.centered;
    dress(para.insertInlinePictureFromBase64(d.base64, Word.InsertLocation.end), d, ids, tag);
    await ctx.sync();
  });
  last = { tag, title: d.title };
  say(`Inserted "${d.title}".`);
});

// Replaces the selected diagram picture, or the one last inserted/loaded when
// nothing is selected, with whatever diagram the editor has open.
$("replace").onclick = () => act("Replacing...", async () => {
  const ids = current;
  const d = await exportDiagram(ids);
  let tag;
  await word(async ctx => {
    const s = await inspectSelection(ctx);
    if (s.kind === "other") throw new Error("The selected picture isn't a Lucid diagram from this add-in, so it's left alone.");
    let pic, found, viaRange = false;
    if (s.kind === "ours") {
      pic = s.pic; found = s.found; viaRange = s.alone;
    } else {
      if (!last) throw new Error("Select the diagram picture to replace in the document first.");
      const all = ctx.document.body.inlinePictures;
      all.load("items/altTextTitle,items/altTextDescription");
      await ctx.sync();
      pic = all.items.find(p => p.altTextTitle === last.tag);
      if (!pic) throw new Error(`"${last.title}" isn't in the document any more. Select the diagram to replace.`);
      found = parseAlt(pic.altTextDescription);
    }
    // The picture keeps its tag; a picture from before tags gets one now.
    tag = pic.altTextTitle && pic.altTextTitle.startsWith(TAG_PREFIX) ? pic.altTextTitle : newTag();
    // A diagram linked by pasted URL has no embed id; keep the picture's own if it's the same diagram.
    const embedId = ids.embedId || (found && found.documentId === ids.documentId ? found.embedId : null);
    const target = viaRange ? s.range : pic;
    dress(target.insertInlinePictureFromBase64(d.base64, Word.InsertLocation.replace), d, { documentId: ids.documentId, embedId }, tag);
    await ctx.sync();
  });
  last = { tag, title: d.title };
  say(`Replaced with "${d.title}".`);
});

$("load").onclick = () => act("Loading...", async () => {
  let found;
  await word(async ctx => {
    const s = await inspectSelection(ctx);
    if (s.kind !== "ours") throw new Error("Select a diagram picture from this add-in in the document first.");
    found = s.found;
    // Tag it so Replace can find it again once the selection moves on.
    let tag = s.pic.altTextTitle;
    if (!tag || !tag.startsWith(TAG_PREFIX)) { tag = newTag(); s.pic.altTextTitle = tag; await ctx.sync(); }
    last = { tag, title: found.title };
  });
  current = { documentId: found.documentId, embedId: found.embedId };
  // Without an embed id (inserted via a pasted URL) the editor can't jump straight to it.
  await loadEditor(found.embedId);
  say(found.embedId ? `Loaded "${found.title}". Edit it, then Replace selected.`
    : `Linked to "${found.title}". Pick it in the editor to edit, then Replace selected.`);
});

$("lucid").onclick = () => {
  const url = `https://lucid.app/lucidchart/${current.documentId}/edit`;
  if (inWord && Office.context.requirements.isSetSupported("OpenBrowserWindowApi", "1.1")) Office.context.ui.openBrowserWindow(url);
  else window.open(url, "_blank");
  say("Opened in Lucid. Edits there show up here on the next Replace.");
};

$("new").onclick = () => act("Loading...", async () => {
  current = null;
  await loadEditor();
  say("Pick or create a document, choose Edit, then click Insert in the editor.");
});

$("docUrl").oninput = () => {
  const m = $("docUrl").value.match(new RegExp(UUID));
  if (!m) return;
  current = { documentId: m[0], embedId: null };
  say("Using the pasted document.");
  refreshButtons();
};

$("signIn").onclick = () => {
  // Lucid's sign-in page refuses to load in a frame, so it gets a real browser tab.
  if (inWord && Office.context.requirements.isSetSupported("OpenBrowserWindowApi", "1.1")) Office.context.ui.openBrowserWindow(BACKEND + "/login");
  else window.open(BACKEND + "/login", "_blank");
  say("Finish signing in in the tab that opened...");
  // Poll until the backend has a token, then carry on without another click.
  const until = Date.now() + 5 * 60000;
  clearInterval(signInTimer);
  signInTimer = setInterval(async () => {
    let s;
    try { s = await (await fetch(BACKEND + "/status")).json(); } catch { return; }
    if (s.signedIn) { clearInterval(signInTimer); start(); }
    else if (Date.now() > until) { clearInterval(signInTimer); say("Sign-in timed out. Click Sign in to try again.", true); }
  }, 2000);
};

$("retry").onclick = start;

(async () => {
  refreshButtons();
  // The page also runs in a plain browser (handy for testing the Lucid side);
  // there Office never connects, and the Word buttons stay off.
  try {
    const info = await within(Office.onReady(), 5000, "Office");
    inWord = info.host === Office.HostType.Word;
  } catch (e) { console.warn(e.message); }
  if (inWord) {
    Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, onSelectionChanged,
      r => console.log("selection handler:", r.status, r.error && r.error.message));
    readSelection();
  } else console.warn("not running inside Word: Insert/Replace/Load are disabled");
  refreshButtons();
  await start();
})();
</script>
</body>
</html>

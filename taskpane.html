<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lucidchart Diagrams</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Calibri, system-ui, sans-serif; margin: 0; height: 100vh;
    display: flex; flex-direction: column; background: #fff; color: #000; }
  #bar { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
    border-bottom: 1px solid #e0e0e0; flex: none; font-size: 0.85rem; }
  #build { color: #999; margin-left: auto; }
  #status { color: #555; }
  #frame { flex: 1; min-height: 0; width: 100%; border: 0; }
</style>
</head>
<body>
<div id="bar">
  <button id="load">Load editor</button>
  <a id="login" href="https://localhost:3000/login" target="_blank" hidden>Sign in to Lucid</a>
  <input id="docUrl" placeholder="paste Lucid document URL" size="28">
  <button id="insert">Insert into Word</button>
  <span id="status"></span>
  <span id="build">build v5</span>
</div>
<iframe id="frame"></iframe>
<script>
// Hardcoded: the prototype backend runs on this machine only (see server.js).
const BACKEND = "https://localhost:3000";
const $ = id => document.getElementById(id);

$("load").onclick = async () => {
  $("status").textContent = "getting embed token...";
  $("login").hidden = true;
  let r;
  try { r = await fetch(BACKEND + "/embed-token"); }
  catch (e) { $("status").textContent = "backend unreachable -- is `node server.js` running?"; return; }
  const body = await r.text();
  console.log("embed-token", r.status, body.slice(0, 80));
  if (r.status === 401) { $("status").textContent = "not signed in"; $("login").hidden = false; return; }
  if (!r.ok) { $("status").textContent = "error " + r.status + ": " + body; return; }
  $("frame").src = "https://lucid.app/embeds?token=" + encodeURIComponent(body);
  $("status").textContent = "";
};

// Lucid's embed doesn't say which document you opened, so the URL is pasted.
$("insert").onclick = async () => {
  try {
    const id = ($("docUrl").value.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/) || [])[0];
    if (!id) { $("status").textContent = "no document id in that URL"; return; }
    $("status").textContent = "exporting...";
    const r = await fetch(BACKEND + "/export?doc=" + id);
    console.log("export", r.status, r.headers.get("content-type"));
    if (r.status === 401) { $("status").textContent = "not signed in"; $("login").hidden = false; return; }
    if (!r.ok) { $("status").textContent = "export error " + r.status + ": " + await r.text(); return; }
    const bytes = new Uint8Array(await r.arrayBuffer());
    console.log("export bytes", bytes.length);
    let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
    $("status").textContent = "inserting " + bytes.length + " bytes...";
    await Office.onReady(); // Word.run throws cryptic errors before Office is initialized
    await Word.run(async ctx => {
      ctx.document.getSelection().insertInlinePictureFromBase64(btoa(bin), Word.InsertLocation.replace);
      await ctx.sync();
    });
    $("status").textContent = "inserted";
  } catch (e) {
    console.error(e);
    $("status").textContent = "failed: " + e.message;
  }
};

// Embed iframe may postMessage; log everything until we know what it sends.
window.addEventListener("message", e => console.log("message from", e.origin, e.data));
</script>
</body>
</html>
